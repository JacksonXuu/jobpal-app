version: '1.0'
name: master-deploy
displayName: 'Master 分支自动部署'
triggers:
  trigger: auto
  push:
    branches:
      include:
        - master
variables:
  global:
    - SSH_PRIVATE_KEY
    - REMOTE_HOST
    - REMOTE_USER
    - REMOTE_PATH
stages:
  - name: build-and-deploy
    displayName: '构建与部署'
    strategy: naturally
    trigger: auto
    steps:
      - step: shell@docker
        name: deploy
        displayName: '构建并部署'
        dockerImage: node:18
        shell: bash
        commands:
          - set -e
          - node -v
          - npm -v
          - npm install
          - npm run type-check
          - npm test
          - npm run build:h5
          - ls -la dist/build/h5/
          - apt-get update -qq && apt-get install -y -qq openssh-client rsync
          - mkdir -p ~/.ssh
          - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          - chmod 600 ~/.ssh/id_ed25519
          - ssh-keyscan -H $REMOTE_HOST >> ~/.ssh/known_hosts
          - rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" dist/build/h5/ $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/
          - echo "部署完成"
