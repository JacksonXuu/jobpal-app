<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JobPal 主页原型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #E8ECF0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* 手机壳 */
  .phone {
    width: 390px;
    height: 844px;
    background: #F5F7FA;
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2), 0 0 0 3px #1A1A2E;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* 状态栏 */
  .status-bar {
    background: #F5F7FA;
    padding: 14px 28px 8px;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: #1A1A2E;
  }

  /* 导航栏 */
  .nav-bar {
    background: #F5F7FA;
    padding: 8px 20px 12px;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    color: #1A1A2E;
  }

  /* 内容区域 */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 0;
  }

  /* ===== 第一栏：问候区 ===== */
  .greeting-card {
    background: linear-gradient(135deg, #0cb5b2 0%, #0a9e9b 100%);
    border-radius: 20px;
    padding: 28px 24px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .greeting-card::after {
    content: '';
    position: absolute;
    right: -20px;
    top: -20px;
    width: 100px;
    height: 100px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .greeting-emoji { font-size: 22px; }
  .greeting-text {
    display: block;
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    margin-top: 4px;
    position: relative;
    z-index: 1;
  }
  .greeting-sub {
    display: block;
    font-size: 14px;
    color: rgba(255,255,255,0.75);
    margin-top: 4px;
    position: relative;
    z-index: 1;
  }

  /* ===== 第二栏：资产卡片 ===== */
  .section-title {
    font-size: 16px;
    font-weight: 600;
    color: #1A1A2E;
    margin-bottom: 12px;
  }
  .asset-cards {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }
  .asset-card {
    flex: 1;
    background: #fff;
    border-radius: 16px;
    padding: 20px 10px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .asset-card:active { transform: scale(0.96); }
  .asset-icon {
    font-size: 32px;
    margin-bottom: 8px;
  }
  .asset-count {
    font-size: 24px;
    font-weight: 700;
    color: #0cb5b2;
    margin-bottom: 2px;
  }
  .asset-label {
    font-size: 12px;
    color: #8E8E93;
  }

  /* ===== 第三栏：功能操作 ===== */
  .feature-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    overflow: hidden;
    margin-bottom: 24px;
  }
  .feature-item {
    display: flex;
    align-items: center;
    padding: 18px 20px;
    cursor: pointer;
    transition: background 0.15s;
    border-bottom: 1px solid #F0F0F0;
  }
  .feature-item:last-child { border-bottom: none; }
  .feature-item:active { background: #F8F8F8; }
  .feature-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-right: 14px;
  }
  .feature-icon.opt { background: #ecfefe; }
  .feature-icon.quiz { background: #FFF3E0; }
  .feature-icon.mock { background: #E8F5E9; }
  .feature-text {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
    color: #1A1A2E;
  }
  .feature-arrow {
    font-size: 22px;
    color: #C0C0C0;
  }

  /* ===== 占位页面 ===== */
  .placeholder-page {
    display: none;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .placeholder-page.show { display: flex; }
  .placeholder-icon {
    font-size: 64px;
    margin-bottom: 20px;
  }
  .placeholder-title {
    font-size: 18px;
    font-weight: 600;
    color: #1A1A2E;
    margin-bottom: 8px;
  }
  .placeholder-desc {
    font-size: 14px;
    color: #8E8E93;
  }

  /* ===== 底部 TabBar ===== */
  .tabbar {
    display: flex;
    background: #fff;
    border-top: 0.5px solid #E0E0E0;
    padding-bottom: env(safe-area-inset-bottom, 4px);
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0 6px;
    cursor: pointer;
    transition: opacity 0.15s;
    position: relative;
  }
  .tab-item:active { opacity: 0.7; }
  .tab-icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 2px;
  }
  .tab-label {
    font-size: 11px;
    color: #8E8E93;
  }
  .tab-item.active .tab-label {
    color: #0cb5b2;
    font-weight: 600;
  }

  /* 中间大按钮 */
  .tab-item.center .tab-icon-wrap {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, #0cb5b2, #0a9e9b);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-top: -18px;
    margin-bottom: 2px;
    box-shadow: 0 4px 12px rgba(12,181,178,0.35);
    color: #fff;
  }

  /* 返回按钮 */
  .back-btn {
    position: absolute;
    top: 56px;
    left: 16px;
    font-size: 28px;
    color: #1A1A2E;
    cursor: pointer;
    z-index: 10;
    display: none;
  }
  .back-btn.show { display: block; }

  /* 通知条 */
  .notice-banner {
    background: #FFF9E6;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    font-size: 13px;
    color: #8D6E00;
  }
  .notice-icon { margin-right: 8px; font-size: 16px; }
</style>
</head>
<body>

<div class="phone" id="phone">
  <!-- 状态栏 -->
  <div class="status-bar">
    <span>9:41</span>
    <span>▮▮▮▮ ▮▮▮▮</span>
  </div>

  <!-- 返回按钮 -->
  <div class="back-btn" id="backBtn" onclick="goBack()">← 返回</div>

  <!-- 导航栏 -->
  <div class="nav-bar" id="navTitle">主页</div>

  <!-- 主页内容 -->
  <div class="content" id="homeContent">
    <!-- 第一栏：问候区 -->
    <div class="greeting-card">
      <span class="greeting-text"><span class="greeting-emoji">👋</span> 你好，张三</span>
      <span class="greeting-sub">欢迎回来，今天也是元气满满的一天</span>
    </div>

    <!-- 通知条 -->
    <div class="notice-banner">
      <span class="notice-icon">📢</span> 简历优化功能已上线，快去试试吧～
    </div>

    <!-- 第二栏：资产卡片 -->
    <div class="section-title">我的资产</div>
    <div class="asset-cards">
      <div class="asset-card" onclick="goToPage('我的简历')">
        <div class="asset-icon">📄</div>
        <div class="asset-count">0</div>
        <div class="asset-label">我的简历</div>
      </div>
      <div class="asset-card" onclick="goToPage('心动岗位')">
        <div class="asset-icon">💼</div>
        <div class="asset-count">0</div>
        <div class="asset-label">心动岗位</div>
      </div>
      <div class="asset-card" onclick="goToPage('面试记录')">
        <div class="asset-icon">📝</div>
        <div class="asset-count">0</div>
        <div class="asset-label">面试记录</div>
      </div>
    </div>

    <!-- 第三栏：功能操作 -->
    <div class="section-title">功能操作</div>
    <div class="feature-card">
      <div class="feature-item" onclick="goToPage('简历优化')">
        <div class="feature-icon opt">✨</div>
        <span class="feature-text">简历优化</span>
        <span class="feature-arrow">›</span>
      </div>
      <div class="feature-item" onclick="goToPage('定向刷题')">
        <div class="feature-icon quiz">🎯</div>
        <span class="feature-text">定向刷题</span>
        <span class="feature-arrow">›</span>
      </div>
      <div class="feature-item" onclick="goToPage('模拟面试')">
        <div class="feature-icon mock">💬</div>
        <span class="feature-text">模拟面试</span>
        <span class="feature-arrow">›</span>
      </div>
    </div>

    <div style="height: 16px;"></div>
  </div>

  <!-- 占位页面 -->
  <div class="placeholder-page" id="placeholderContent">
    <div class="placeholder-icon">🚀</div>
    <div class="placeholder-title" id="placeholderTitle">功能名称</div>
    <div class="placeholder-desc">功能即将上线，敬请期待</div>
  </div>

  <!-- 底部 TabBar -->
  <div class="tabbar" id="tabbar">
    <div class="tab-item active" id="tabHome" onclick="switchTab('home')">
      <div class="tab-icon">🏠</div>
      <span class="tab-label">主页</span>
    </div>
    <div class="tab-item center" id="tabAsk" onclick="switchTab('ask')">
      <div class="tab-icon-wrap">💬</div>
      <span class="tab-label">问一问</span>
    </div>
    <div class="tab-item" id="tabProfile" onclick="switchTab('profile')">
      <div class="tab-icon">👤</div>
      <span class="tab-label">我的</span>
    </div>
  </div>
</div>

<script>
  let currentTab = 'home';

  function switchTab(tab) {
    currentTab = tab;

    // 更新 tab 状态
    document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
    document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');

    const homeContent = document.getElementById('homeContent');
    const placeholderContent = document.getElementById('placeholderContent');
    const navTitle = document.getElementById('navTitle');
    const backBtn = document.getElementById('backBtn');

    if (tab === 'home') {
      homeContent.style.display = '';
      placeholderContent.classList.remove('show');
      navTitle.textContent = '主页';
      backBtn.classList.remove('show');
    } else if (tab === 'ask') {
      homeContent.style.display = 'none';
      placeholderContent.classList.add('show');
      document.getElementById('placeholderTitle').textContent = '问一问';
      navTitle.textContent = '问一问';
      backBtn.classList.remove('show');
    } else if (tab === 'profile') {
      homeContent.style.display = 'none';
      placeholderContent.classList.add('show');
      document.getElementById('placeholderTitle').textContent = '我的';
      // 模拟我的页面
      placeholderContent.querySelector('.placeholder-icon').textContent = '👤';
      navTitle.textContent = '我的';
      backBtn.classList.remove('show');
    }
  }

  function goToPage(title) {
    homeContent.style.display = 'none';
    const placeholderContent = document.getElementById('placeholderContent');
    placeholderContent.classList.add('show');
    document.getElementById('placeholderTitle').textContent = title;
    document.getElementById('navTitle').textContent = title;
    document.getElementById('backBtn').classList.add('show');

    // 取消所有 tab 选中
    document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
  }

  function goBack() {
    homeContent.style.display = '';
    document.getElementById('placeholderContent').classList.remove('show');
    document.getElementById('navTitle').textContent = '主页';
    document.getElementById('backBtn').classList.remove('show');

    // 恢复 tab
    document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
    document.getElementById('tabHome').classList.add('active');
    currentTab = 'home';
  }
</script>

</body>
</html>
